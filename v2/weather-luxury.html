*{box-sizing:border-box}body{margin:0;background:#07101b;color:#d8f6ff;font-family:Inter,system-ui,-apple-system,"Thonburi",sans-serif}main{max-width:1350px;margin:35px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}h1{font-size:20px;margin:0}p{font-size:13px;color:#9fc7d9;margin:8px 0}.notice{color:#ffeab0;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.controls button{font:inherit;font-size:12px;color:#b7d9e8;border:1px solid #285a70;background:#102334;border-radius:20px;padding:7px 11px}.controls button.active{color:#fff;background:#14577a;border-color:#8aeaff}.viewport{position:relative;width:100%;overflow:hidden}.board{width:1296px;height:120px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse 45% 95% at 38% 100%,rgba(17,145,218,.18),transparent 92%),linear-gradient(180deg,#0b2036,#040b16 87%);box-shadow:inset 0 0 24px rgba(25,130,194,.1);color:white}.board:after{position:absolute;inset:1px;content:"";border:2px solid #56c9ff9c;border-radius:17px;box-shadow:inset 0 0 8px #4bd4ff6c,0 0 8px #30bfff;pointer-events:none;z-index:9}.scene{position:absolute;left:82px;top:0;width:475px;height:120px;object-fit:cover;object-position:center;mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 72%,transparent 100%)}.clock{position:absolute;left:11px;top:9px;width:180px;height:103px;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:2px 6px 7px 9px;isolation:isolate}.clock:after{content:"";position:absolute;inset:-32px -70px -32px -38px;background:radial-gradient(ellipse at 36% 50%,rgba(0,5,15,.94),rgba(0,7,19,.80) 40%,rgba(0,8,20,.33) 68%,transparent 100%);filter:blur(10px);z-index:-1}.date{font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;color:#b5e3f9;transform:translateY(-4px)}.time{font-size:64px;line-height:.96;font-weight:900;letter-spacing:-2.2px;margin-top:-2px;color:#fff;text-shadow:0 0 7px #eaffffb5}.icon{position:absolute;left:326px;top:-2px;width:170px;height:130px;object-fit:contain;z-index:3}.heading{position:absolute;left:492px;top:7px;font-size:14px;font-weight:800;color:#c3e8f6;white-space:nowrap}.temp{position:absolute;left:487px;top:14px;font-weight:900;font-size:90px;line-height:1;letter-spacing:-6px;color:#a6f3ff;text-shadow:0 2px 6px #1384af}.temp small{font-size:29px;letter-spacing:0;vertical-align:18px}.feel{position:absolute;left:493px;bottom:6px;font-size:13px;font-weight:800;color:#bdeafa}.stats{position:absolute;left:700px;top:13px;width:210px;height:94px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px 10px}.stat{border-left:1px solid #33728c;padding-left:9px;display:flex;flex-direction:column;justify-content:center}.stat span{font-size:11px;color:#9ccddd}.stat b{font-size:23px;line-height:1;color:#a1edff;text-shadow:0 0 5px #1f8aad}.forecast{position:absolute;left:927px;right:12px;top:7px;bottom:7px;padding:4px 6px;background:#07162bb0;border:1px solid #34759b99;border-radius:8px}.forecast-title{font-size:11px;font-weight:800;color:#d6f2ff}.days{display:grid;grid-template-columns:repeat(7,1fr);height:76px;align-items:start;text-align:center}.day{min-width:0;font-size:10px;color:#c7e9f7}.day b{display:block;font-size:11px;color:#fff}.day i{display:block;font-style:normal;font-size:17px;height:20px}.day small{color:#8bd8f2;font-size:9px}.graph{position:absolute;left:9px;right:9px;bottom:8px;width:calc(100% - 18px);height:17px;overflow:visible}.foot{margin-top:18px;font-size:12px;color:#a2c4d0;line-height:1.65}.native{width:432px;max-width:100%;margin-top:15px;border:1px solid #30516b;position:relative;overflow:hidden}@media(prefers-reduced-motion:reduce){.icon{display:none}.icon-poster{display:block!important}}.icon-poster{display:none}@media(max-width:600px){main{margin:20px auto;padding:0 10px}.head h1{font-size:16px}.controls{gap:5px}.controls button{font-size:1 .icon-glow{position:absolute;left:323px;top:-25px;width:180px;height:165px;z-index:2;background:radial-gradient(ellipse,rgba(0,9,19,.38),transparent 70%);pointer-events:none;filter:blur(8px)}

.forecast{left:919px;right:10px;top:7px;bottom:7px;padding:4px 5px;background:#06182db5}.forecast-title{display:none}.days{height:100%;position:relative;z-index:2}.day{font-size:11px;line-height:1.05}.day .forecast-icon{display:block;width:32px;height:27px;object-fit:contain;margin:0 auto}.day b{font-size:13px;color:#ffad8a;line-height:1}.day .rain-chance{position:absolute;bottom:2px;transform:translateX(-50%);font-size:10px;color:#b7eaff;white-space:nowrap}.day .rain-chance img{width:8px;height:11px;vertical-align:-2px;object-fit:contain}.graph{left:10px;right:10px;top:61px;bottom:auto;width:calc(100% - 20px);height:20px;z-index:1}.graph path#area{fill:url(#graphfill)}.graph path#line{stroke:#92efff;stroke-width:2}.graph circle{fill:#f7ffff;stroke:#7be6ff;stroke-width:1}

.temp{left:525px}.feel{left:527px}.icon{left:354px}.icon-glow{left:345px;width:185px;background:radial-gradient(ellipse at 50% 48%,rgba(1,12,27,.72) 0%,rgba(2,20,37,.42) 40%,transparent 74%)}
.rain-symbol{width:23px;height:32px;position:relative;flex:none}.stat .rain-symbol img{position:absolute;object-fit:contain;width:12px;height:16px}.rain-symbol img:nth-child(1){left:0;top:6px}.rain-symbol img:nth-child(2){left:7px;top:0}.rain-symbol img:nth-child(3){left:13px;top:9px}

.temp{left:537px}.feel{left:537px;width:144px;justify-content:center;white-space:nowrap}
.icon{left:333px;top:-23px;width:205px;height:205px}

html,body{margin:0;width:432px;height:40px;overflow:hidden;background:#000}.board{left:0;top:0;transform:scale(0.3333333333)}</style></head><body><section class="board" id="board" aria-label="สภาพอากาศจากแบบจำลอง Open-Meteo"><img class="scene" id="scene" alt=""><div class="clock"><span class="date" id="date"></span><span class="time" id="time"></span></div><div class="icon-glow"></div><img class="icon" id="icon" alt=""><img class="icon icon-poster" id="poster" alt=""><span class="heading">สภาพอากาศ</span><div class="temp"><span id="temp">—</span><small>°C</small></div><div class="feel"><span class="feel-value">รู้สึก <b id="feels">—</b></span><span class="heat-tag" id="advice" hidden></span></div><div class="stats"><div class="stat rain" aria-label="โอกาสฝน"><span class="rain-symbol" aria-hidden="true"><img src="weather-assets/drop.png" alt=""><img src="weather-assets/drop.png" alt=""><img src="weather-assets/drop.png" alt=""></span><b id="rain">—</b></div><div class="stat humidity" aria-label="ความชื้น"><img src="weather-assets/drop.png" alt=""><b id="humidity">—</b></div><div class="stat high" aria-label="อุณหภูมิสูงสุด"><img src="weather-assets/thermometer.png" alt=""><b id="high">—</b></div><div class="stat low" aria-label="อุณหภูมิต่ำสุด"><img src="weather-assets/thermometer.png" alt=""><b id="low">—</b></div></div><div class="forecast"><div class="forecast-title">พยากรณ์ 7 วัน · โอกาสฝนรายวัน*</div><div class="days" id="days"></div><svg class="graph" viewBox="0 0 350 20" preserveAspectRatio="none"><defs><linearGradient id="graphfill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="350" y2="0"></linearGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="white" stop-opacity=".85"/><stop offset="100%" stop-color="white" stop-opacity=".05"/></linearGradient><mask id="graphfade"><rect width="350" height="20" fill="url(#fade)"/></mask></defs><path id="area" mask="url(#graphfade)"/><path id="line" fill="none"/><g id="points"><
