<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สภาพอากาศ · โรงพยาบาลอุทัย</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101b;color:#d8f6ff;font-family:Inter,system-ui,-apple-system,"Thonburi",sans-serif}main{max-width:1350px;margin:35px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}h1{font-size:20px;margin:0}p{font-size:13px;color:#9fc7d9;margin:8px 0}.notice{color:#ffeab0;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.controls button{font:inherit;font-size:12px;color:#b7d9e8;border:1px solid #285a70;background:#102334;border-radius:20px;padding:7px 11px}.controls button.active{color:#fff;background:#14577a;border-color:#8aeaff}.viewport{position:relative;width:100%;overflow:hidden}.board{width:1296px;height:120px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse 45% 95% at 38% 100%,rgba(17,145,218,.18),transparent 92%),linear-gradient(180deg,#0b2036,#040b16 87%);box-shadow:inset 0 0 24px rgba(25,130,194,.1);color:white}.board:after{position:absolute;inset:1px;content:"";border:2px solid #56c9ff9c;border-radius:17px;box-shadow:inset 0 0 8px #4bd4ff6c,0 0 8px #30bfff;pointer-events:none;z-index:9}.scene{position:absolute;left:82px;top:0;width:475px;height:120px;object-fit:cover;object-position:center;mask-image:linear-gradient(90deg,transparent 0%,#000 10%,#000 72%,transparent 100%)}.clock{position:absolute;left:11px;top:9px;width:180px;height:103px;z-index:5;display:flex;flex-direction:column;justify-content:center;padding:2px 6px 7px 9px;isolation:isolate}.clock:after{content:"";position:absolute;inset:-32px -70px -32px -38px;background:radial-gradient(ellipse at 36% 50%,rgba(0,5,15,.94),rgba(0,7,19,.80) 40%,rgba(0,8,20,.33) 68%,transparent 100%);filter:blur(10px);z-index:-1}.date{font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;color:#b5e3f9;transform:translateY(-4px)}.time{font-size:64px;line-height:.96;font-weight:900;letter-spacing:-2.2px;margin-top:-2px;color:#fff;text-shadow:0 0 7px #eaffffb5}.icon{position:absolute;left:326px;top:-2px;width:170px;height:130px;object-fit:contain;z-index:3}.heading{position:absolute;left:492px;top:7px;font-size:14px;font-weight:800;color:#c3e8f6;white-space:nowrap}.temp{position:absolute;left:487px;top:14px;font-weight:900;font-size:90px;line-height:1;letter-spacing:-6px;color:#a6f3ff;text-shadow:0 2px 6px #1384af}.temp small{font-size:29px;letter-spacing:0;vertical-align:18px;margin-left:12px}.feel{position:absolute;left:493px;bottom:6px;font-size:13px;font-weight:800;color:#bdeafa}.stats{position:absolute;left:700px;top:13px;width:210px;height:94px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px 10px}.stat{border-left:1px solid #33728c;padding-left:9px;display:flex;flex-direction:column;justify-content:center}.stat span{font-size:11px;color:#9ccddd}.stat b{font-size:23px;line-height:1;color:#a1edff;text-shadow:0 0 5px #1f8aad}.forecast{position:absolute;left:927px;right:12px;top:7px;bottom:7px;padding:4px 6px;background:#07162bb0;border:1px solid #34759b99;border-radius:8px}.forecast-title{font-size:11px;font-weight:800;color:#d6f2ff}.days{display:grid;grid-template-columns:repeat(7,1fr);height:76px;align-items:start;text-align:center}.day{min-width:0;font-size:10px;color:#c7e9f7}.day b{display:block;font-size:11px;color:#fff}.day i{display:block;font-style:normal;font-size:17px;height:20px}.day small{color:#8bd8f2;font-size:9px}.graph{position:absolute;left:9px;right:9px;bottom:8px;width:calc(100% - 18px);height:17px;overflow:visible}.foot{margin-top:18px;font-size:12px;color:#a2c4d0;line-height:1.65}.native{width:432px;max-width:100%;margin-top:15px;border:1px solid #30516b;position:relative;overflow:hidden}@media(prefers-reduced-motion:reduce){.icon{display:none}.icon-poster{display:block!important}}.icon-poster{display:none}@media(max-width:600px){main{margin:20px auto;padding:0 10px}.head h1{font-size:16px}.controls{gap:5px}.controls button{font-size:11px;padding:6px}}

/* Owner revision: readable temperature, compact symbols, larger anchored artwork. */
.icon{left:332px;top:-5px;width:160px;height:160px;object-fit:contain}
.heading{display:none}.temp{top:8px;left:489px;font-size:92px;letter-spacing:-6px;line-height:1;background:linear-gradient(180deg,#fff 0%,#c9f9ff 42%,#42c6ed 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}.temp small{font-size:25px;letter-spacing:0;vertical-align:14px;margin-left:12px}/* margin keeps °C clear of the -6px tracked digits and their glyph overhang */
.feel{left:491px;bottom:5px;display:flex;gap:5px;align-items:center;font-size:14px}.feel-value,.heat-tag{border-radius:6px;padding:2px 6px;line-height:1.15;font-weight:850}.feel-value{background:#06223c;border:1px solid #3c8db3;color:#d4f4ff}.feel-value b{color:#ffbb95}.heat-tag{background:#61340b;border:1px solid #e4a340;color:#ffdda2}.heat-tag[hidden]{display:none}
.stats{left:704px;top:9px;width:200px;height:102px;gap:0;grid-template-columns:1fr 1fr}.stat{border-left:1px solid #377795;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;padding-left:7px;gap:3px}.stat:nth-child(n+3){border-top:1px solid #377795}.stat img{height:31px;width:23px;object-fit:contain}.stat b{font-size:23px;line-height:1;letter-spacing:-1px;text-shadow:none}.stat.rain b{color:#8ee9ff}.stat.humidity b{color:#7ce7df}.stat.high b{color:#ff9c7c}.stat.low b{color:#8ad8ff}.stat.low img{filter:hue-rotate(175deg) saturate(1.25)}
.forecast{left:919px;right:10px;top:7px;bottom:7px;padding:4px 5px;background:#06182db5}.forecast-title{display:none}.days{height:100%;position:relative;z-index:2}.day{font-size:11px;line-height:1.05}.day .forecast-icon{display:block;height:26px;margin:0 auto;background-repeat:no-repeat}.day b{font-size:13px;color:#ffad8a;line-height:1}.day .rain-chance{position:absolute;bottom:2px;transform:translateX(-50%);font-size:10px;color:#b7eaff;white-space:nowrap}.day .rain-chance img{width:8px;height:11px;vertical-align:-2px;object-fit:contain}.graph{left:10px;right:10px;top:61px;bottom:auto;width:calc(100% - 20px);height:20px;z-index:1}.graph path#area{fill:url(#graphfill)}.graph path#line{stroke:url(#graphfill);stroke-width:2.5}.graph circle{fill:#f7ffff;stroke:#7be6ff;stroke-width:1}

/* V3: bring the reading and weather art closer to the rain column. */
.temp{left:525px}.feel{left:527px}.icon{left:354px}
.rain-symbol{width:23px;height:32px;position:relative;flex:none}.stat .rain-symbol img{position:absolute;object-fit:contain;width:12px;height:16px}.rain-symbol img:nth-child(1){left:0;top:6px}.rain-symbol img:nth-child(2){left:7px;top:0}.rain-symbol img:nth-child(3){left:13px;top:9px}
.stat.humidity img{filter:hue-rotate(270deg) saturate(1.7) brightness(1.12)}

/* V5: forecast mini icons reuse the same luxury 3D poster assets, fitted to
   each poster's alpha bounds so the visible art fills a uniform 26px slot
   instead of shrinking inside the 128px transparent canvas (object-fit at
   32x27 showed cloudy/fog/wind art only ~6-8px tall). Wide flat arts cap at
   48.5px column width and anchor to the slot bottom. JS sets the condition;
   these rules crop the exact art region via background-size/position. */
.day .forecast-icon[data-condition="partly-cloudy"]{width:30.3px;background-image:url(weather-assets/partly-cloudy-poster.png);background-size:49.7px;background-position:-9.7px -2.3px}
.day .forecast-icon[data-condition="cloudy"]{width:48.5px;background-image:url(weather-assets/cloudy-poster.png);background-size:79.6px;background-position:-15.5px -25.6px}
.day .forecast-icon[data-condition="fog"]{width:48.5px;background-image:url(weather-assets/fog-poster.png);background-size:79.6px;background-position:-15.5px -26.2px}
.day .forecast-icon[data-condition="night"]{width:39px;background-image:url(weather-assets/night-poster.png);background-size:64px;background-position:-12.5px -8px}
.day .forecast-icon[data-condition="night-rain"]{width:20.7px;background-image:url(weather-assets/night-rain-poster.png);background-size:34px;background-position:-6.4px -4.2px}
.day .forecast-icon[data-condition="night-thunderstorm"]{width:20.7px;background-image:url(weather-assets/night-thunderstorm-poster.png);background-size:34px;background-position:-6.4px -4.2px}
.day .forecast-icon[data-condition="night-wind"]{width:34.1px;background-image:url(weather-assets/night-wind-poster.png);background-size:43.2px;background-position:0 -5.1px}
.day .forecast-icon[data-condition="rain"]{width:28.2px;background-image:url(weather-assets/rain-poster.png);background-size:46.2px;background-position:-8.7px -15.2px}
.day .forecast-icon[data-condition="thunderstorm"]{width:28.2px;background-image:url(weather-assets/thunderstorm-poster.png);background-size:46.2px;background-position:-8.7px -15.2px}
.day .forecast-icon[data-condition="wind"]{width:48.5px;background-image:url(weather-assets/wind-poster.png);background-size:61.5px;background-position:0 -18.2px}

/* V4: center the warning below the reading and improve contrast behind the icon. */
.temp{left:537px}.feel{left:537px;width:144px;justify-content:center;white-space:nowrap}
/* Each CSS board pixel is one third of a native 432x40 LED pixel.
   Boxes come from each poster's alpha bounds. Sun-and-cloud art grew 20%
   over the 179px original (215px box). Boxes stay clear of the clock halo
   (x<262) and the reading (x>530). Night rain/thunderstorm and night wind
   were measured across all 96 APNG frames (alpha>=25 union): the rain
   pair's art already spans y6.4..118.9 of the 120px board, so the requested
   +30% (146px art height) cannot fit at any offset — it is 26px taller
   than the board; the owner then explicitly approved the max-fit
   unclipped alternative: 147→156 (+6.1%) with every mid/solid row
   inside the clip (art 0.5..119.9, center shifted up 6 board px). Night wind art spans y8.4..100.4, so
   155→200 (+29%) fits with its visible art center moved down exactly
   2 native px (54.4→60.4; art 1.0..119.8). */
.icon{left:328px;top:-4px;width:215px;height:215px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.68)) drop-shadow(0 0 8px rgba(2,8,20,.58)) drop-shadow(0 0 19px rgba(0,5,15,.52))}
.icon[data-condition="night"]{left:305px;top:-39px;width:262px;height:262px}
.icon[data-condition="cloudy"]{left:213px;top:-155px;width:393px;height:393px}
.icon[data-condition="fog"]{left:224px;top:-149px;width:380px;height:380px}
.icon[data-condition="wind"]{left:292px;top:-117px;width:302px;height:302px}
.icon[data-condition="rain"],.icon[data-condition="thunderstorm"]{left:343px;top:-46px;width:185px;height:185px}
.icon[data-condition="night-rain"],.icon[data-condition="night-thunderstorm"]{left:358px;top:-19px;width:156px;height:156px}
.icon[data-condition="night-wind"]{left:329px;top:-24px;width:200px;height:200px}

.feel .source-at{font-size:12px;font-weight:800;color:#b9e6fa;background:#06223c;border:1px solid #3c8db3;border-radius:5px;padding:2px 4px;line-height:1.2;white-space:nowrap}.source-at[hidden]{display:none!important}
