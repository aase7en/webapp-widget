.hour:last-child{border-right:0}.hour .t{font-size:8px;color:#ecfaff;font-weight:800;line-height:10px}.hour svg{display:block;width:25px;height:18px;overflow:visible;filter:drop-shadow(0 1px 1px #031d3bb0) drop-shadow(0 0 2px #b3eeff45);will-change:transform}.hour .rain-pct{color:#28d2ff;font-size:10px;line-height:10px;font-weight:900;text-shadow:0 0 4px #11a9fb44}
.hour[data-weather="storm"] svg{animation:cloudStormFloat 4.9s ease-in-out infinite}.hour[data-weather="rain"] svg{animation:cloud3dFloat 5.3s ease-in-out infinite}.hour[data-weather="partly"] svg{animation:cloud3dFloat 6.8s ease-in-out infinite}.hour[data-weather="cloud"] svg{animation:cloud3dFloat 7.2s ease-in-out infinite}

   staggered travel makes rain appear continuous; lightning occurs in
   two short, irregularly spaced pulses per gentle 6.4s cycle. */

  animation:rainTravel 1.22s linear infinite;filter:drop-shadow(0 0 1.5px #75dfff)}
.hour[data-weather="storm"] .rain-drop{animation-duration:.72s}
.hour .lightning-bolt{opacity:0;transform-box:fill-box;transform-origin:50% 10%;

@keyframes rainTravel{
  0%{transform:translate3d(-.5px,-2px,0) scale(.8);opacity:0}
  17%{opacity:.97}
  69%{opacity:.95}
  100%{transform:translate3d(1.1px,4.5px,0) scale(1);opacity:0}
}

  39%,39.5%{opacity:1;filter:drop-shadow(0 0 4px #fff6c8)}
  74.5%,75%{opacity:.72;filter:drop-shadow(0 0 2px #ffdf7f)}
  76%,76.4%{opacity:.94;filter:drop-shadow(0 0 3px #ffef91)}
}
@media(prefers-reduced-motion:reduce){

}

.current .current-sun-aura{fill:#ffb933;opacity:.35;filter:blur(2px);

.current .current-sun-glint{fill:#fffef2;opacity:.72;

.current[data-weather="none"] .sun-big{animation:none;filter:grayscale(1) brightness(.72)}
.current .rain-drop{opacity:0;transform-box:fill-box;transform-origin:center;

.current[data-weather="storm"] .rain-drop{animation-duration:.72s}
.current .lightning-bolt{opacity:0;transform-box:fill-box;transform-origin:50% 10%;

@keyframes currentSunTurn{to{transform:rotate(360deg)}}
@keyframes currentSunBreathe{0%,100%{opacity:.2;transform:scale(.94)}50%{opacity:.64;transform:scale(1.12)}}
@keyframes currentSunGlint{0%,100%{opacity:.49}50%{opacity:.95}}

.current .rain-drop{opacity:.85;transform:translateY(1px)}

}
