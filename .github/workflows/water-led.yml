name: Water LED
on:
  pull_request:
    paths:
      - 'water.html'
      - 'water.js'
      - 'index.html'
      - 'tests/water-led.test.cjs'
      - '.github/workflows/water-led.yml'
  push:
    branches: [main]
    paths:
      - 'water.html'
      - 'water.js'
      - 'index.html'
      - 'tests/water-led.test.cjs'
      - '.github/workflows/water-led.yml'
jobs:
  water-led-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check water.js
      - run: node --test tests/water-led.test.cjs
      - name: Verify main strip keeps water UNAVAILABLE with no iframe
        run: |
          grep -q 'รอข้อมูลจริง' index.html
          grep -q 'id="wa-value">—' index.html
          ! grep -q 'script.google.com' index.html
