name: Portable Widget Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check portable.js
      - run: node --check < apps-script/Code.gs
      - run: node --check < apps-script/flood-news-watch/Code.gs
      - run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -p 'test_*.py'
